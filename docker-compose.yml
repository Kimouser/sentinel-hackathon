version: "3.8"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sentinel-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./m2_bus/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  postgis:
    image: postgis/postgis:16-3.4
    container_name: sentinel-db
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_dev
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - ./m5_storage/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - sentinel_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports:
      - "6379:6379"

volumes:
  sentinel_pgdata:
